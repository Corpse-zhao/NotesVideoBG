name: Build NotesVideoBG

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          ref: master
          submodules: recursive
          path: theos

      - name: Install iOS SDK
        run: |
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/sdks
          cd /tmp/sdks
          git sparse-checkout set iPhoneOS14.5.sdk
          mkdir -p $GITHUB_WORKSPACE/theos/sdks
          cp -r /tmp/sdks/iPhoneOS14.5.sdk $GITHUB_WORKSPACE/theos/sdks/

      - name: Install iOS toolchain
        run: |
          TC=$GITHUB_WORKSPACE/theos/toolchain/linux/iphone
          mkdir -p $TC /tmp/tc
          curl -L -q --retry 3 -o /tmp/tc.tar.lzma https://github.com/sbingner/llvm-project/releases/latest/download/linux-ios-arm64e-clang-toolchain.tar.lzma
          tar --lzma -xf /tmp/tc.tar.lzma -C /tmp/tc
          if [ -d /tmp/tc/bin ]; then cp -a /tmp/tc/. $TC/; else for d in /tmp/tc/*/; do cp -a "$d". $TC/; done; fi
          # 工具链依赖 libtinfo5 (LLVM-10), ubuntu-22.04 仓库有
          sudo apt-get update -qq && sudo apt-get install -y -qq libtinfo5 || true
          if ! ldconfig -p | grep -q libtinfo.so.5; then
            curl -sL -o /tmp/t5.deb http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.3-2_amd64.deb
            sudo dpkg -x /tmp/t5.deb /tmp/t5 && sudo cp /tmp/t5/lib/x86_64-linux-gnu/libtinfo.so.5* /usr/lib/x86_64-linux-gnu/ && sudo ldconfig
          fi
          ls $TC/bin/clang && $TC/bin/clang --version

      - name: Build package
        env:
          THEOS: ${{ github.workspace }}/theos
        run: make package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1

      - name: Synthesize arm64e slice (Settings/OneSettings are arm64e processes)
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          DEB=$(ls packages/*.deb)
          rm -rf /tmp/debx && mkdir -p /tmp/debx
          dpkg-deb -R "$DEB" /tmp/debx
          python3 tools/arm64e_fat.py \
            /tmp/debx/var/jb/Library/PreferenceBundles/NVBPrefs.bundle/NVBPrefs \
            /tmp/debx/var/jb/Library/MobileSubstrate/DynamicLibraries/NotesVideoBG.dylib
          LDID_BIN="$(command -v ldid || true)"
          if [ -z "$LDID_BIN" ] && [ -x theos/bin/ldid ]; then LDID_BIN=theos/bin/ldid; fi
          if [ -z "$LDID_BIN" ]; then
            curl -sL --retry 3 -o /tmp/ldid https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64
            chmod +x /tmp/ldid
            LDID_BIN=/tmp/ldid
          fi
          "$LDID_BIN" -S /tmp/debx/var/jb/Library/PreferenceBundles/NVBPrefs.bundle/NVBPrefs
          "$LDID_BIN" -S /tmp/debx/var/jb/Library/MobileSubstrate/DynamicLibraries/NotesVideoBG.dylib
          dpkg-deb -b /tmp/debx "$DEB"
          ls -la packages/

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: NotesVideoBG-deb
          path: packages/*.deb
          if-no-files-found: error
